<svg width="100%" viewBox="0 0 1200 260" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0b14"/>
      <stop offset="100%" stop-color="#151228"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6C63FF"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="260" fill="url(#bg)"/>

  <!-- floating dots -->
  <g fill="#6C63FF" opacity="0.25">
    <circle cx="120" cy="60" r="4"><animate attributeName="cy" values="60;80;60" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="1050" cy="200" r="5"><animate attributeName="cy" values="200;180;200" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="960" cy="70" r="3"><animate attributeName="cy" values="70;90;70" dur="6s" repeatCount="indefinite"/></circle>
    <circle cx="200" cy="200" r="3"><animate attributeName="cy" values="200;185;200" dur="4.5s" repeatCount="indefinite"/></circle>
  </g>

  <!-- name -->
  <text x="600" y="115" font-family="'Segoe UI',Arial,sans-serif" font-size="58" font-weight="800" fill="#ffffff" text-anchor="middle" opacity="0">
    Muhammad Abdullah
    <animate attributeName="opacity" values="0;1" dur="1.2s" fill="freeze"/>
  </text>

  <!-- animated underline -->
  <rect x="440" y="135" height="4" rx="2" fill="url(#accent)" width="0">
    <animate attributeName="width" values="0;320" dur="1s" begin="0.6s" fill="freeze"/>
  </rect>

  <!-- tagline -->
  <text x="600" y="185" font-family="'Segoe UI',Arial,sans-serif" font-size="22" font-weight="500" fill="#A78BFA" text-anchor="middle" opacity="0">
    AI Automation • Chatbots • n8n • Local SEO
    <animate attributeName="opacity" values="0;1" dur="1s" begin="1.1s" fill="freeze"/>
  </text>

  <!-- subtag -->
  <text x="600" y="220" font-family="'Segoe UI',Arial,sans-serif" font-size="16" fill="#8b8ba7" text-anchor="middle" opacity="0">
    Founder @ Sazaan Studios  •  Building in public
    <animate attributeName="opacity" values="0;1" dur="1s" begin="1.5s" fill="freeze"/>
  </text>
</svg>
